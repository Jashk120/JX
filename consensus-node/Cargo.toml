
[workspace]
resolver = "3"
members = [
    "protocol/primitives",
    "protocol/crypto",
    "protocol/consensus",
    "protocol/gossip",
    "protocol/storage",
    "protocol/stream",
    "protocol/test-support",
    "executor/state",
    "node",
]

[workspace.package]
edition = "2024"
version = "0.0.1"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2.2.0"
anyhow = "1"
thiserror = "2"
 primitives = { path = "protocol/primitives" }
 crypto = { path = "protocol/crypto" }
 consensus = { path = "protocol/consensus" }
 gossip = { path = "protocol/gossip" }
 storage = { path = "protocol/storage" }
 stream = { path = "protocol/stream" }
 test-support = { path = "protocol/test-support" }
 state = { path = "executor/state" }
sha2 = "0.10"
rand = "0.8"
blst = "0.3"
toml = "0.8"
serde_json = "1"
fjall = "3.1.8"
prost = "0.14"
prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
match_wildcard_for_single_variants = "allow"
ip_constant = "allow"
return_self_not_must_use = "allow"
manual_let_else = "allow"
match_wild_err_arm = "allow"
cloned_instead_of_copied = "allow"
redundant_closure_for_method_calls = "allow"
items_after_statements = "allow"
option_option = "allow"
too_many_lines = "allow"
manual_midpoint = "allow"
redundant_closure = "allow"
similar_names = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
needless_continue = "allow"
format_collect = "allow"
needless_pass_by_value = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
cast_sign_loss = "allow"
single_match_else = "allow"
implicit_clone = "allow"
unused_async = "allow"
explicit_into_iter_loop = "allow"
semicolon_if_nothing_returned = "allow"
struct_field_names = "allow"
unnested_or_patterns = "allow"
ignored_unit_patterns = "allow"
if_not_else = "allow"
unused_async_trait_impl = "allow"
uninlined_format_args = "allow"
single_char_pattern = "allow"