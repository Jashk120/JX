// The mirror-facing stream file schema (Phase 8, point 3).
//
// Two new file types a mirror node consumes, both emitted by a *consensus*
// node into a node-scoped directory under `<data>/streams/`:
//
//   - Event stream file (`.esf`): every gossip event this node inserted, in
//     insertion (= topological) order — the offline DAG source.
//   - Record stream file (`.rsf`): one file per decided round, carrying the
//     round's finalized transactions in consensus order plus the round's
//     threshold-signed `SignedCheckpoint` (the state-root anchor).
//
// Both file types are chained by a running hash (§5 of PHASE8_MIRROR_STREAMS.md)
// and accompanied by an Ed25519 signature file (`.esf_sig` / `.rsf_sig`).
//
// This schema is vendored here for now; it migrates to a shared schema repo
// owned together with the Go mirror, at which point `build.rs` switches to
// include that repo instead of this file.
//
// A message in this file is the on-disk content of exactly one stream file:
// the `.esf` bytes are a serialized `EventStreamFile`, the `.rsf` bytes are a
// serialized `RecordStreamFile`. The `version` field is carried *inside* the
// message rather than as a separate file header.
syntax = "proto3";

package jkain.stream;

// ---------- shared ----------

// A digest commitment. `algorithm` is 0 = SHA-256 (JKaIN's native hash);
// the remaining fields are reserved for future additions.
message HashObject {
  uint32 algorithm = 1;
  uint32 length    = 2; // 32 for SHA-256
  bytes  hash      = 3;
}

// One Ed25519 signature over the digest in `hash_object`.
message SignatureObject {
  uint32 type          = 1; // 0 = ED25519
  uint32 length        = 2; // 64
  bytes  signature     = 3; // Ed25519 over the referenced hash
  HashObject hash_object = 4;
}

// The signature file accompanying every stream file (`.esf_sig` / `.rsf_sig`).
message SignatureFile {
  // Ed25519 over the SHA-256 of the whole stream file bytes.
  SignatureObject file_signature     = 1;
  // Ed25519 over the SHA-256 of the file metadata
  // (header || start_running_hash || end_running_hash [|| round]).
  SignatureObject metadata_signature = 2;
}

// ---------- event stream (`.esf`) ----------

message Transaction {
  bytes payload = 1;
}

// A mirror-facing mirror of `primitives::Event` plus its record metadata
// (`seq`, `birth_round`, `round_received`), so a mirror can rebuild the DAG
// and reproduce see/fork behavior.
message Event {
  uint64          creator      = 1;
  optional bytes  self_parent  = 2; // 32-byte EventHash, absent when None
  optional bytes  other_parent = 3;
  uint64          timestamp    = 4;
  repeated Transaction transactions = 5;
  bytes           signature    = 6; // 64-byte Ed25519
  // record metadata for DAG rebuild
  uint64          seq           = 7;
  uint64          birth_round   = 8;
  optional uint64 round_received = 9;
  optional uint64 consensus_timestamp = 10;
}

message EventStreamFile {
  uint32     version            = 1;
  HashObject start_running_hash = 2;
  repeated Event events         = 3;
  HashObject end_running_hash   = 4;
}

// ---------- record stream (`.rsf`, one file per decided round) ----------

// One finalized transaction, linked back to its source event.
message RecordItem {
  bytes  event_hash = 1; // source event, 32 bytes
  uint32 tx_index   = 2; // index in that event's payload
  bytes  tx_payload = 3; // Op::Put/Delete or MembershipOp bytes
}

message CheckpointSig {
  uint64 round  = 1;
  uint64 signer = 2;
  bytes  sig    = 3; // 64-byte Ed25519
}

message CheckpointRosterMember {
  uint64 node_id = 1;
  bytes  key     = 2; // 32-byte Ed25519 verifying key
}

// A mirror of `consensus::SignedCheckpoint` — the threshold-signed state-root
// anchor that makes a record file source-agnostic.
message SignedCheckpoint {
  uint64      round       = 1;
  bytes       state_hash  = 2; // Merkle root, 32 bytes
  bytes       roster_hash = 3; // 32 bytes
  repeated CheckpointRosterMember roster_snapshot = 4;
  repeated CheckpointSig sigs = 5;
}

message RecordStreamFile {
  uint32     version            = 1;
  uint64     round              = 2;
  HashObject start_running_hash = 3;
  repeated RecordItem items     = 4;
  HashObject end_running_hash   = 5;
  SignedCheckpoint checkpoint   = 6; // the threshold-signed anchor
}
