
[workspace]
resolver = "3"
members = [
    "primitives",
    "crypto",
]

[workspace.package]
edition = "2024"
version = "0.0.1"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
primitives = { path = "primitives", version = "0.0.1" }

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"