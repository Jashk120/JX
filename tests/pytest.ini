[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    bench: throughput / finality benchmarks (slow, heavy)
    finality: latency-to-finality tests
    tps: TPS benchmark tests
    gossip: 6-node gossip convergence tests
    chaos: partition / network-chaos tests
    smoke: quick single-node health smoke (fast, <20s)
